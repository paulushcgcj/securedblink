[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp"
version = "0.1.0"
description = "MCP server for multi-database access with LLM permission gating"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",   # PostgreSQL, included by default
    "keyring>=24.0",          # Secure credential storage
    "structlog>=24.0",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
mysql = ["PyMySQL>=1.1"]
mssql = ["pyodbc>=5.0"]
yaml = ["pyyaml>=6.0"]  # For parsing .yml/.yaml config files
dev = ["pytest>=8.0", "pytest-cov>=5.0.0", "pytest-mock>=3.14.0",
       "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=db_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=95",
]

[tool.coverage.run]
source = ["db_mcp"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S"]

[tool.mypy]
strict = true
python_version = "3.12"

[project.scripts]
db-mcp = "db_mcp.server:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["db_mcp"]
