[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp"
version = "0.1.0"
description = "MCP server for multi-database access with LLM permission gating"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    { name = "Paulo Gomes da Cruz Junior", email = "paulo.cruz@gov.bc.ca" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "database",
    "sql",
    "sqlalchemy",
    "llm",
    "credential-vault",
    "keyring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",   # PostgreSQL, included by default
    "keyring>=24.0",          # Secure credential storage
    "structlog>=24.0",        # Structured logging (stderr)
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
mysql = ["PyMySQL>=1.1"]
mssql = ["pyodbc>=5.0"]
yaml = ["pyyaml>=6.0"]  # For parsing .yml/.yaml config files

[project.scripts]
db-mcp = "db_mcp.server:cli_main"

[project.urls]
Homepage      = "https://github.com/paulushcgcj/db-mcp"
Documentation = "https://github.com/paulushcgcj/db-mcp#readme"
Repository    = "https://github.com/paulushcgcj/db-mcp"
"Bug Tracker" = "https://github.com/paulushcgcj/db-mcp/issues"
Changelog     = "https://github.com/paulushcgcj/db-mcp/blob/main/CHANGELOG.md"

# uv-native dependency groups (consumed by `uv sync --group dev|test` in CI).
# PyInstaller lives here so `uv sync --frozen` in release.yml installs it
# without a separate uv pip install step.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=db_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=95",
]

[tool.coverage.run]
source = ["db_mcp"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.hatch.build.targets.wheel]
packages = ["db_mcp"]