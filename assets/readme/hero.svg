<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">securedblink — MCP database gateway</title>
<desc id="desc">An MCP gateway that lets LLM agents read freely, preview writes, and execute only with an explicit approval token.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 H 0 V 24" fill="none" stroke="#1A222C" stroke-width="0.6" opacity="0.5"/>
  </pattern>
  <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#12B5A8" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0E8F85" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F5A524"/>
    <stop offset="100%" stop-color="#E07B00"/>
  </linearGradient>
</defs>

<!-- background -->
<rect width="1200" height="380" rx="26" fill="#070B10"/>
<rect width="1200" height="380" rx="26" fill="url(#grid)" opacity="0.9"/>
<!-- top hairline -->
<rect x="56" y="24" width="1088" height="1" rx="0.5" fill="#1E2A37" opacity="0.9"/>
<!-- left title block -->
<g id="title-block" transform="translate(56 44)">
  <!-- eyebrow -->
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="168" height="22" rx="11" fill="none" stroke="#1E2A37" stroke-width="1.1"/>
    <circle cx="14" cy="11" r="3.5" fill="#12B5A8"/>
    <text x="24" y="15.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="0.08em" fill="#8A9199">MCP  ·  DATABASE  ·  GATEWAY</text>
  </g>
  <!-- name -->
  <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="850" letter-spacing="-0.03em" fill="#E7EBEF">securedblink</text>
  <!-- underline accent -->
  <rect x="0" y="77" width="272" height="3" rx="1.5" fill="#12B5A8"/>
  <!-- description -->
  <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500" fill="#E7EBEF">Read freely. Preview writes.</text>
  <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500" fill="#E7EBEF">Approve explicitly.</text>
  <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#8A9199">LLMs inspect and query PostgreSQL, SQLite, Oracle, MySQL, MSSQL</text>
  <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#8A9199">through MCP — without risking silent mutations.</text>

  <!-- metadata row -->
  <g transform="translate(0 208)">
    <g>
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="none" stroke="#12B5A8" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="1.6" fill="#12B5A8"/>
      <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#E7EBEF">Python 3.12+</text>
    </g>
    <g transform="translate(122 0)">
      <rect x="0" y="0" width="104" height="26" rx="13" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
      <text x="12" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#8A9199">SQLAlchemy</text>
    </g>
    <g transform="translate(236 0)">
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
      <text x="12" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#8A9199">MCP 1.x</text>
    </g>
    <g transform="translate(330 0)">
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
      <text x="12" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#8A9199">GPL-3.0</text>
    </g>
  </g>
</g>

<!-- right proof panel -->
<g id="proof-panel" transform="translate(680 34)">
  <rect x="0" y="0" width="464" height="312" rx="22" fill="#0F1D26" stroke="#1E2A37" stroke-width="1.2"/>
  <!-- panel header -->
  <text x="22" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#8A9199">PERMISSION-GATED FLOW</text>
  <rect x="22" y="32" width="420" height="1" fill="#1E2A37"/>
  <!-- agent label -->
  <g transform="translate(22 48)">
    <rect x="0" y="0" width="88" height="54" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
    <circle cx="20" cy="18" r="10" fill="none" stroke="#E7EBEF" stroke-width="1.3"/>
    <circle cx="20" cy="40" r="14" fill="none" stroke="#E7EBEF" stroke-width="1.1" opacity="0.35"/>
    <path d="M 12 40 A 14 14 0 0 1 28 40" fill="none" stroke="#E7EBEF" stroke-width="1.1"/>
    <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#E7EBEF">agent</text>
    <text x="42" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8A9199">LLM / MCP</text>
    <text x="42" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">client</text>
  </g>
  <!-- DB label -->
  <g transform="translate(354 48)">
    <rect x="0" y="0" width="88" height="54" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
    <!-- cylinder -->
    <g transform="translate(18 12)">
      <ellipse cx="12" cy="6" rx="11" ry="5.5" fill="none" stroke="#12B5A8" stroke-width="1.2"/>
      <path d="M 1 6 V 22 A 11 5.5 0 0 0 23 6 V 6" fill="none" stroke="#12B5A8" stroke-width="1.2"/>
      <ellipse cx="12" cy="22" rx="11" ry="5.5" fill="none" stroke="#12B5A8" stroke-width="1.2" opacity="0.45"/>
      <path d="M 1 14 A 11 5.5 0 0 0 23 14" fill="none" stroke="#12B5A8" stroke-width="0.8" opacity="0.45"/>
    </g>
    <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#E7EBEF">database</text>
    <text x="42" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8A9199">any SQLAlchemy</text>
    <text x="42" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">Postgres/SQLite…</text>
  </g>

  <!-- READ path -->
  <g transform="translate(22 118)">
    <rect x="0" y="0" width="420" height="56" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
    <rect x="10" y="10" width="36" height="36" rx="8" fill="#12B5A8" opacity="0.14"/>
    <path d="M 19 28 L 25 22 L 28 22 L 28 28 L 22 34 Z M 25 22 L 28 19 L 31 22 L 28 25 Z" fill="#12B5A8"/>
    <text x="54" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#12B5A8">READ PATH  ·  FREE</text>
    <text x="54" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#E7EBEF">SELECT / EXPLAIN / SHOW / DESCRIBE</text>
    <!-- arrow line -->
    <g transform="translate(110 48)">
      <line x1="0" y1="0" x2="186" y2="0" stroke="#12B5A8" stroke-width="1.6" stroke-linecap="round"/>
      <polygon points="186,0 178,-4.5 178,4.5" fill="#12B5A8"/>
      <text x="62" y="-6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#12B5A8" letter-spacing="0.06em">RUNS IMMEDIATELY</text>
    </g>
    <text x="368" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5A6370">via query</text>
  </g>

  <!-- WRITE path -->
  <g transform="translate(22 186)">
    <rect x="0" y="0" width="420" height="108" rx="12" fill="#070B10" stroke="#F5A524" stroke-width="1" stroke-dasharray="0"/>
    <rect x="0" y="0" width="420" height="28" rx="12" fill="#F5A524" opacity="0.95"/>
    <rect x="0" y="16" width="420" height="12" fill="#F5A524" opacity="0.95"/>
    <rect x="10" y="6" width="16" height="16" rx="4" fill="none" stroke="#070B10" stroke-width="1.2"/>
    <path d="M 14 14 L 18 10 M 18 10 H 15.5 M 18 10 V 12.5" stroke="#070B10" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="0.07em" fill="#070B10">WRITE PATH  ·  GATED</text>
    <text x="310" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.06em" fill="#070B10" opacity="0.8">INSERT / UPDATE / DELETE</text>

    <!-- stages -->
    <g transform="translate(14 40)">
      <!-- preview -->
      <g>
        <rect x="0" y="0" width="86" height="56" rx="10" fill="#1A222C" stroke="#1E2A37" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#F5A524" opacity="0.18"/>
        <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" fill="#F5A524">1</text>
        <text x="34" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#E7EBEF">preview</text>
        <text x="34" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8A9199">mutation</text>
        <text x="10" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">exact SQL bound</text>
        <text x="10" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">to connection</text>
      </g>
      <!-- arrow 1 -->
      <g transform="translate(92 28)">
        <line x1="0" y1="0" x2="12" y2="0" stroke="#F5A524" stroke-width="1.2" stroke-dasharray="3 3"/>
        <polygon points="12,0 7,-3 7,3" fill="#F5A524"/>
      </g>
      <!-- approval -->
      <g transform="translate(108 0)">
        <rect x="0" y="0" width="100" height="56" rx="10" fill="#F5A524" stroke="#E07B00" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#070B10" opacity="0.12"/>
        <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" fill="#070B10">2</text>
        <text x="34" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#070B10">approval</text>
        <text x="34" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#070B10" opacity="0.7">explicit human</text>
        <g transform="translate(10 38)">
          <rect x="0" y="0" width="80" height="14" rx="7" fill="#070B10"/>
          <circle cx="7" cy="7" r="3" fill="#F5A524"/>
          <text x="14" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#E7EBEF" letter-spacing="0.04em">ONE-TIME TOKEN</text>
        </g>
      </g>
      <!-- arrow 2 -->
      <g transform="translate(214 28)">
        <line x1="0" y1="0" x2="12" y2="0" stroke="#F5A524" stroke-width="1.2"/>
        <polygon points="12,0 7,-3 7,3" fill="#F5A524"/>
      </g>
      <!-- execute -->
      <g transform="translate(230 0)">
        <rect x="0" y="0" width="86" height="56" rx="10" fill="#1A222C" stroke="#1E2A37" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#12B5A8" opacity="0.14"/>
        <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" fill="#12B5A8">3</text>
        <text x="34" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#E7EBEF">execute</text>
        <text x="34" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8A9199">validated</text>
        <text x="10" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">5-min expiry</text>
        <text x="10" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">single-use</text>
      </g>
      <!-- tiny badge -->
      <g transform="translate(312 44)">
        <circle cx="6" cy="6" r="6" fill="#12B5A8"/>
        <path d="M 2.5 6 L 5 8.5 L 9 4" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <!-- dashed connector to DB hint -->
    <text x="336" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">token → SQL → DB</text>
  </g>
</g>

<!-- bottom rule -->
<rect x="56" y="356" width="1088" height="1" fill="#1E2A37" opacity="0.6"/>
<text x="56" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.08em" fill="#5A6370">DB_LOCAL  ·  DB_ANALYTICS  ·  DB_MAX_ROWS=500  ·  SECUREDBLINK_ALLOWED_ROOTS  ·  vault: macOS Keychain  ·  Linux Secret Service  ·  Windows Credential Manager</text>
</svg>
