<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">How securedblink gates every write</title>
<desc id="desc">Read queries run immediately; writes require preview, a bound single-use token, explicit approval, and validated execution. Credentials never leave the vault.</desc>
<defs>
  <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 H 0 V 24" fill="none" stroke="#1A2330" stroke-width="0.55" opacity="0.45"/>
  </pattern>
</defs>
<rect width="1200" height="520" rx="26" fill="#070B10"/>
<rect width="1200" height="520" rx="26" fill="url(#grid2)"/>

<!-- header -->
<g transform="translate(40 28)">
  <rect x="0" y="0" width="48" height="22" rx="11" fill="none" stroke="#1E2A37" stroke-width="1"/>
  <text x="11" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#8A9199">02</text>
  <text x="62" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em" fill="#8A9199">HOW IT WORKS</text>
  <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.03em" fill="#E7EBEF">Every write is previewed, bound, and explicitly approved.</text>
  <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#8A9199">Reads are free. Writes cannot be silent — the token binds exact SQL + connection for five minutes, once.</text>
</g>

<!-- READ lane -->
<g transform="translate(40 112)">
  <rect x="0" y="0" width="1120" height="96" rx="16" fill="#0F1D26" stroke="#1E2A37" stroke-width="1.1"/>
  <g transform="translate(18 18)">
    <rect x="0" y="0" width="138" height="60" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
    <circle cx="20" cy="18" r="8" fill="#12B5A8" opacity="0.16"/>
    <path d="M 15 22 L 19 26 L 26 17" fill="none" stroke="#12B5A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="0.07em" fill="#12B5A8">READ LANE</text>
    <text x="42" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E7EBEF">no gating</text>
    <text x="42" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">query() · immediate</text>
  </g>
  <!-- steps read -->
  <g transform="translate(176 18)">
    <!-- agent call -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="170" height="60" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
      <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.07em" fill="#8A9199">AGENT CALLS</text>
      <text x="14" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#E7EBEF">query(sql)</text>
      <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">SELECT · EXPLAIN · SHOW</text>
    </g>
    <g transform="translate(180 30)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#12B5A8" stroke-width="1.6"/>
      <polygon points="28,0 22,-4 22,4" fill="#12B5A8"/>
    </g>
    <g transform="translate(218 0)">
      <rect x="0" y="0" width="170" height="60" rx="12" fill="#12B5A8" opacity="0.95"/>
      <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="800" letter-spacing="0.07em" fill="#070B10">SECUREDBLINK</text>
      <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="800" fill="#070B10">validates · runs</text>
      <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#070B10" opacity="0.7">read-only path</text>
    </g>
    <g transform="translate(398 30)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#12B5A8" stroke-width="1.6"/>
      <polygon points="28,0 22,-4 22,4" fill="#12B5A8"/>
    </g>
    <g transform="translate(436 0)">
      <rect x="0" y="0" width="220" height="60" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
      <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.07em" fill="#8A9199">DATABASE</text>
      <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#E7EBEF">returns rows</text>
      <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">capped by DB_MAX_ROWS=500</text>
    </g>
    <g transform="translate(666 30)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#8A9199" stroke-width="1.1" stroke-dasharray="4 4"/>
      <polygon points="28,0 22,-4 22,4" fill="#8A9199"/>
    </g>
    <g transform="translate(704 0)">
      <rect x="0" y="0" width="160" height="60" rx="12" fill="#1A222C" stroke="#1E2A37" stroke-width="1"/>
      <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#8A9199">AGENT RECEIVES</text>
      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E7EBEF">result + schema</text>
    </g>
  </g>
</g>

<!-- WRITE lane -->
<g transform="translate(40 228)">
  <rect x="0" y="0" width="1120" height="174" rx="16" fill="#070B10" stroke="#F5A524" stroke-width="1.25"/>
  <!-- label -->
  <g transform="translate(18 18)">
    <rect x="0" y="0" width="138" height="138" rx="12" fill="#F5A524"/>
    <rect x="10" y="10" width="18" height="18" rx="5" fill="none" stroke="#070B10" stroke-width="1.3"/>
    <path d="M 14.5 19 L 18 15.5 M 18 15.5 H 15.8 M 18 15.5 V 17.7" stroke="#070B10" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="0.07em" fill="#070B10">WRITE LANE</text>
    <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.02em" fill="#070B10">Gated.</text>
    <text x="10" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#070B10" opacity="0.75">preview → approve</text>
    <text x="10" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#070B10" opacity="0.75">→ execute</text>
    <g transform="translate(10 92)">
      <rect x="0" y="0" width="118" height="36" rx="10" fill="#070B10"/>
      <text x="10" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" letter-spacing="0.06em" fill="#F5A524">DROP / ALTER / INSERT</text>
      <text x="10" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="600" fill="#8A9199">UPDATE / DELETE / TRUNCATE</text>
    </g>
  </g>

  <!-- 5 steps -->
  <g transform="translate(176 18)">
    <!-- 1 preview -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="168" height="138" rx="12" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
      <circle cx="20" cy="22" r="14" fill="#F5A524" opacity="0.14"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#F5A524">1</text>
      <text x="44" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.07em" fill="#8A9199">STEP 01</text>
      <text x="44" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#E7EBEF">preview_mutation</text>
      <text x="14" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#8A9199">agent supplies</text>
      <rect x="14" y="66" width="140" height="28" rx="8" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
      <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">connection</text>
      <text x="20" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#E7EBEF">+ exact SQL</text>
      <text x="14" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">returns operation +</text>
      <text x="14" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#F5A524">one-time token</text>
    </g>
    <!-- arrow -->
    <g transform="translate(174 69)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#F5A524" stroke-width="1.3"/>
      <polygon points="20,0 14,-4 14,4" fill="#F5A524"/>
    </g>
    <!-- 2 token -->
    <g transform="translate(200 0)">
      <rect x="0" y="0" width="168" height="138" rx="12" fill="#1A222C" stroke="#F5A524" stroke-width="1"/>
      <circle cx="20" cy="22" r="14" fill="#F5A524" opacity="0.95"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#070B10">2</text>
      <text x="44" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.07em" fill="#F5A524">BOUND TOKEN</text>
      <text x="44" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#E7EBEF">exact SQL ↔ connection</text>
      <g transform="translate(14 48)">
        <rect x="0" y="0" width="140" height="22" rx="11" fill="#070B10" stroke="#F5A524" stroke-width="1"/>
        <circle cx="11" cy="11" r="4" fill="#F5A524"/>
        <text x="20" y="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" letter-spacing="0.06em" fill="#E7EBEF">SHA-256  ·  5 MIN  ·  1× USE</text>
      </g>
      <text x="14" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8A9199">agent must show preview</text>
      <text x="14" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8A9199">and ask human to confirm</text>
      <rect x="14" y="104" width="140" height="20" rx="8" fill="#F5A524" opacity="0.14"/>
      <text x="20" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#F5A524">◷  300s expiry</text>
      <text x="96" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">single-use</text>
    </g>
    <!-- arrow -->
    <g transform="translate(374 69)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#F5A524" stroke-width="1.3"/>
      <polygon points="20,0 14,-4 14,4" fill="#F5A524"/>
    </g>
    <!-- 3 human -->
    <g transform="translate(400 0)">
      <rect x="0" y="0" width="168" height="138" rx="12" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
      <circle cx="20" cy="22" r="14" fill="#12B5A8" opacity="0.16"/>
      <text x="15.5" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#12B5A8">3</text>
      <text x="44" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.07em" fill="#8A9199">STEP 03</text>
      <text x="44" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#E7EBEF">explicit approval</text>
      <g transform="translate(14 48)">
        <rect x="0" y="0" width="140" height="38" rx="10" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
        <circle cx="16" cy="12" r="7" fill="none" stroke="#E7EBEF" stroke-width="1.1"/>
        <path d="M 9 22 A 9 9 0 0 1 23 22" fill="none" stroke="#E7EBEF" stroke-width="1.1" opacity="0.5"/>
        <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#E7EBEF">human says yes</text>
        <text x="32" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">MCP client approval</text>
      </g>
      <text x="14" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">no silent writes —</text>
      <text x="14" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">agent cannot skip</text>
      <text x="14" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="600" fill="#12B5A8">↳  agent calls execute_mutation</text>
    </g>
    <!-- arrow -->
    <g transform="translate(574 69)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#12B5A8" stroke-width="1.6"/>
      <polygon points="20,0 14,-4 14,4" fill="#12B5A8"/>
    </g>
    <!-- 4 execute -->
    <g transform="translate(600 0)">
      <rect x="0" y="0" width="168" height="138" rx="12" fill="#12B5A8" opacity="0.95"/>
      <circle cx="20" cy="22" r="14" fill="#070B10" opacity="0.12"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#070B10">4</text>
      <text x="44" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="800" letter-spacing="0.07em" fill="#070B10" opacity="0.75">STEP 04</text>
      <text x="44" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#070B10">execute_mutation</text>
      <text x="14" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#070B10" opacity="0.65">validates token</text>
      <g transform="translate(14 66)">
        <rect x="0" y="0" width="140" height="44" rx="8" fill="#070B10"/>
        <text x="10" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8A9199">checks</text>
        <text x="10" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#E7EBEF">SQL == bound SQL</text>
        <text x="10" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#E7EBEF">conn == bound conn</text>
      </g>
      <text x="14" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#070B10">→ executes → consumes token</text>
    </g>
  </g>
</g>

<!-- vault lane -->
<g transform="translate(40 422)">
  <rect x="0" y="0" width="1120" height="72" rx="16" fill="#0F1D26" stroke="#1E2A37" stroke-width="1"/>
  <g transform="translate(18 14)">
    <rect x="0" y="0" width="138" height="44" rx="11" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
    <rect x="10" y="10" width="16" height="18" rx="2" fill="none" stroke="#8A9199" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="2.6" fill="#8A9199"/>
    <rect x="13" y="22" width="10" height="3" rx="1" fill="#8A9199"/>
    <text x="32" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#8A9199">VAULT LANE</text>
    <text x="32" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#5A6370">credentials never leave host</text>
  </g>
  <g transform="translate(176 14)">
    <rect x="0" y="0" width="924" height="44" rx="12" fill="#070B10" stroke="#1E2A37" stroke-width="1"/>
    <!-- keychain icons -->
    <g transform="translate(14 10)">
      <text x="0" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#8A9199">macOS Keychain</text>
      <text x="0" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">separate from chat</text>
    </g>
    <line x1="118" y1="6" x2="118" y2="38" stroke="#1E2A37" stroke-width="1"/>
    <g transform="translate(132 10)">
      <text x="0" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#8A9199">Linux Secret Service</text>
      <text x="0" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">D-Bus · libsecret</text>
    </g>
    <line x1="264" y1="6" x2="264" y2="38" stroke="#1E2A37" stroke-width="1"/>
    <g transform="translate(278 10)">
      <text x="0" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#8A9199">Windows Credential Manager</text>
      <text x="0" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5A6370">WinCred</text>
    </g>
    <line x1="448" y1="6" x2="448" y2="38" stroke="#1E2A37" stroke-width="1"/>
    <g transform="translate(462 8)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#1A222C" stroke="#1E2A37" stroke-width="1"/>
      <circle cx="10" cy="14" r="3" fill="#12B5A8"/>
      <text x="18" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#E7EBEF">alias resolves locally</text>
    </g>
    <g transform="translate(586 8)">
      <rect x="0" y="0" width="136" height="28" rx="14" fill="#1A222C" stroke="#1E2A37" stroke-width="1"/>
      <text x="10" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#E7EBEF">redacted from logs &amp; tools</text>
    </g>
    <g transform="translate(734 8)">
      <rect x="0" y="0" width="176" height="28" rx="14" fill="#F5A524" opacity="0.14"/>
      <text x="10" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#8A9199">register: securedblink register --alias</text>
      <text x="10" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#F5A524">/ import .env/.properties/.yml</text>
    </g>
  </g>
</g>
</svg>
